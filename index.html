<!-- 창 맨 위 띠: 잡아서 창 옮기기 (titleBarStyle hiddenInset이라 제목 막대가 없음). 본문은 이 띠 아래에서 시작해서 누르는 것과 안 겹침 -->
<div id="dragbar" aria-hidden="true"></div>
<div id="app">
  <!-- 왼쪽 탭: pixel-office nav#tabs와 같은 구조 (색·글꼴만 하우스 팔레트) -->
  <nav id="tabs" role="tablist" aria-label="탭">
    <div class="brand">Pixel House</div>
    <button role="tab" data-tab="home" aria-selected="true">우리집</button>
    <button role="tab" data-tab="habits" aria-selected="false">생활 습관</button>
    <button role="tab" data-tab="meetings" aria-selected="false">약속</button>
    <button role="tab" data-tab="bucket" aria-selected="false" hidden>버킷리스트</button>
    <button role="tab" data-tab="archive" aria-selected="false">생활일지</button>
    <div class="tab-foot">
      <!-- 우리집 탭이 아닐 때 두부가 여기 작게 앉아 있음 (누르면 한마디) -->
      <div id="side-dubu" hidden>
        <div id="side-bubble" class="side-bubble" hidden aria-live="polite"></div>
        <button id="side-dubu-btn" type="button" aria-label="두부에게 말 걸기"><canvas id="side-dubu-cv" width="16" height="20"></canvas></button>
      </div>
    </div>
  </nav>
<main id="main">
  <section id="screen-start" class="screen center">
    <div id="cover">
      <canvas id="cover-cv" aria-label="작은 원목 지붕 집. 돌길이 현관문까지 이어져 있어요"></canvas>
      <div id="cover-bubble" class="cover-bubble" hidden aria-live="polite"></div>
      <button id="btn-enter" class="game">입장하기</button>
    </div>
  </section>
  <section id="screen-onboard" class="screen" hidden aria-label="처음 설정"></section>
  <section id="screen-house" class="screen" hidden>
    <div id="stage" tabindex="0" aria-label="우리 집. 방향키나 클릭으로 두부가 걸어요. 두부를 누르거나 Space를 누르면 말해요.">
      <canvas id="cv"></canvas>
      <div id="overlay">
        <div id="room-name" class="tag" aria-live="polite"></div>
        <div id="bubble" class="bubble" hidden aria-live="polite"></div>
      </div>
      <div id="dlg" hidden><div class="dl-box">
        <div class="dl-text"><div class="dl-name"></div><div class="dl-body"><span class="dl-vis" aria-hidden="true"></span><span class="dl-sr" aria-live="polite"></span></div><div class="dl-more"></div></div>
      </div></div>
    </div>
  </section>
  <section id="screen-habits" class="screen panel" hidden><div class="life" id="life-habits"></div></section>
  <section id="screen-meetings" class="screen panel" hidden><div class="life" id="life-meetings"></div></section>
  <section id="screen-bucket" class="screen panel" hidden><div class="life" id="life-bucket"></div></section>
  <section id="screen-archive" class="screen panel" hidden><div class="life" id="life-archive"></div></section>
</main>
